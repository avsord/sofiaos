name: Sofia estado vivo

# Snapshot somente na branch sofia-state; nao compila APK nem toca no backend.
# O workflow de Android so observa SOFIA_APP/** ou seu proprio arquivo.
'on':
  push:
    branches: [sofia-app-android]
  release:
    types: [published, edited, deleted]
  workflow_dispatch: # Requer definicao no branch default para despacho manual pela API.

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: sofia-state
  cancel-in-progress: true

jobs:
  state:
    name: Gerar e publicar ESTADO_VIVO
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sofia-app-android
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testar gerador, KEY, aprovacoes e ausencia de segredos
        run: node --test tools/sofia-state.test.cjs

      - name: Consultar GitHub sem simular resultado quando API falha
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > /tmp/releases.json || rm -f /tmp/releases.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/sofia-native-047-update.yml/runs?branch=sofia-app-android&per_page=8" > /tmp/runs.json || rm -f /tmp/runs.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=sofia-app-android&sort=updated&direction=desc&per_page=10" > /tmp/pulls.json || rm -f /tmp/pulls.json

      - name: Gerar o snapshot
        run: |
          set -euo pipefail
          args=(--repo-dir . --repo-slug "${GITHUB_REPOSITORY}" --out /tmp/ESTADO_VIVO.md)
          test ! -f /tmp/releases.json || args+=(--release-json /tmp/releases.json)
          test ! -f /tmp/runs.json || args+=(--runs-json /tmp/runs.json)
          test ! -f /tmp/pulls.json || args+=(--pulls-json /tmp/pulls.json)
          node tools/sofia-state.cjs "${args[@]}"
          head -30 /tmp/ESTADO_VIVO.md

      - name: Publicar so o ESTADO_VIVO.md na branch independente
        run: |
          set -euo pipefail
          mkdir -p /tmp/sofia-state-publish
          cp /tmp/ESTADO_VIVO.md /tmp/sofia-state-publish/ESTADO_VIVO.md
          cd /tmp/sofia-state-publish
          git init -q -b sofia-state
          git config user.name "sofia-state[bot]"
          git config user.email "sofia-state@users.noreply.github.com"
          git add ESTADO_VIVO.md
          git commit -q -m "snapshot do estado em ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/sofia-state
