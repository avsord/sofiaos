name: Sofia server connection correction validation
on:
  push:
    branches: [work/sofia-server-unlock-033]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Validate server regressions and complete backup restoration
        run: node --test tests/*.test.cjs | tee server-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sofia-server-unlock-033-tests
          path: server-tests.txt
