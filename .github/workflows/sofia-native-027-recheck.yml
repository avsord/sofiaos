name: Sofia Android 0.3.27 acceptance recheck
on:
  push:
    branches: [work/sofia-native-027]
    paths: [.github/workflows/sofia-native-027-recheck.yml, tools/release027/native-full-smoke.py]
permissions:
  contents: write
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve revised UI selector and use exact built source
        run: |
          cp tools/release027/native-full-smoke.py /tmp/native-full-smoke.py
          git rev-parse HEAD > /tmp/QA_COMMIT.txt
          git checkout --detach aec6f8c20210554d28003505c045a9c2c69dde76
      - uses: actions/download-artifact@v4
        with:
          name: Sofia-Android-0.3.27
          run-id: 37170230387
          github-token: ${{ github.token }}
          path: SOFIA_APP/dist
      - name: Verify unchanged APK and keep QA audit
        working-directory: SOFIA_APP
        run: |
          sha256sum --check dist/Sofia-OS.apk.sha256
          test "$(cat dist/SOURCE_COMMIT.txt)" = "$(git rev-parse HEAD)"
          cp /tmp/native-full-smoke.py dist/native-full-smoke.py
          cp /tmp/QA_COMMIT.txt dist/QA_COMMIT.txt
          rm -rf dist/full-app-evidence
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify complete production shell using foreground UI elements
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: |
            adb install SOFIA_APP/dist/QA-ONLY-full-fixture.apk
            adb logcat -c
            adb shell am start -W -n com.avsord.sofiaapp/.MainActivity
            cd SOFIA_APP && python3 /tmp/native-full-smoke.py
      - name: Publish exact checked production APK
        working-directory: SOFIA_APP
        run: node tools/publish-release.cjs
      - name: Verify release and updater discovery
        working-directory: SOFIA_APP
        run: |
          npm ci
          git show fba71d9c1382aa77e51edb105dcacb776dfcec29:SOFIA_APP/src/lib/update.ts > /tmp/sofia-026-updater.ts
          node <<'NODE' | tee dist/update-discovery.txt
          const fs=require('fs'),ts=require('typescript'),vm=require('vm');
          (async()=>{for(const file of ['/tmp/sofia-026-updater.ts','src/lib/update.ts']){
            const exports={};const code=ts.transpileModule(fs.readFileSync(file,'utf8'),{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.CommonJS}}).outputText;
            vm.runInNewContext(code,{exports,fetch,AbortController,setTimeout,clearTimeout,Date,Error,Promise});
            const result=await exports.checkForUpdate({currentVersion:'0.3.26'});
            if(result?.version!=='0.3.27')throw Error('Update not discoverable: '+file);
            console.log('VERIFIED',file,result.version,result.url);
          }})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          gh api repos/avsord/sofiaos/releases/tags/sofia-android-v0.3.27 > dist/release.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sofia-Android-0.3.27-checked
          path: SOFIA_APP/dist
          retention-days: 30
