name: Diagnose frames of an existing production APK
'on':
  push:
    branches: [sofia-app-android]
    paths: [.github/workflows/sofia-startup-trace.yml, tools/trace-startup.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  trace:
    name: Trace exact 101 APK without rebuilding or publishing
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      SOFIA_TRACE_PROCESSOR: /tmp/sofia-trace-processor
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/download-artifact@v4
      with:
        name: Sofia-build-38007123113-1
        run-id: 38007123113
        github-token: ${{ github.token }}
        path: trace-source/SOFIA_APP/dist
    - uses: actions/download-artifact@v4
      with:
        name: Sofia-build-37809157208-1
        run-id: 37809157208
        github-token: ${{ github.token }}
        path: trace-source/SOFIA_APP/dist/seed-060
    - name: Install official Perfetto trace processor
      run: |
        curl -fsSL https://get.perfetto.dev/trace_processor -o /tmp/sofia-trace-processor
        chmod +x /tmp/sofia-trace-processor
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Retain the original acceptance result and diagnose the candidate
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        arch: x86_64
        target: default
        disable-animations: false
        script: python3 tools/trace-startup.py
    - name: Keep trace evidence; this job is not an acceptance approval
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Sofia-startup-trace-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          trace-source/SOFIA_APP/dist/startup-trace/
          trace-source/SOFIA_APP/dist/manual-evidence/
        if-no-files-found: error
        retention-days: 30
