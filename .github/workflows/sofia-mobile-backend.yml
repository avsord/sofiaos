name: Sofia mobile backend validation
on:
  push:
    branches: [sofia-mobile-backend]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic source migration only
        run: node tools/apply-mobile-v138.cjs
      - name: Install existing backend dependencies
        run: npm ci
      - name: Validate complete suite and native security
        run: |
          set -o pipefail
          mkdir -p /tmp/sofia-validation
          node --test tests/*.test.cjs | tee /tmp/sofia-validation/backend-tests.txt
          node --check src/channels/mobile.js
          node --check src/core/http-handler.js
      - name: Commit validated files to isolated backend branch
        run: |
          git config user.name 'Sofia build'
          git config user.email 'sofia-build@users.noreply.github.com'
          git add -- src public/index.html package.json package-lock.json tests docs 'Comando atual.md' PROMPT_CONTINUAR_SOFIA.md
          if ! git diff --cached --quiet; then
            git commit -m 'feat: apply tested v138 mobile API to existing Sofia backend [skip ci]'
            git push origin HEAD:refs/heads/sofia-mobile-backend
          fi
          git rev-parse HEAD > /tmp/sofia-validation/SOURCE_COMMIT.txt
      - name: Read-only check of public deployment
        run: |
          set -e
          for i in $(seq 1 30); do
            curl -fsS --max-time 20 https://sofiaos.up.railway.app/health > /tmp/sofia-validation/live-health.json || true
            VERSION=$(node -e "try{const x=require('/tmp/sofia-validation/live-health.json');process.stdout.write(String(x.version||''))}catch{}")
            CODE=$(curl -sS -o /tmp/sofia-validation/mobile-login-probe.json -w '%{http_code}' --max-time 20 -H 'Content-Type: application/json' -d '{"email":"probe@example.invalid","password":"not-a-real-password","device_name":"validation"}' https://sofiaos.up.railway.app/api/mobile/auth/login || true)
            printf '%s\n' "$CODE" > /tmp/sofia-validation/mobile-login-status.txt
            if [ "$VERSION" = "138.0.0" ] && [ "$CODE" = "401" ] && grep -q '"code":"LOGIN_INVALID"' /tmp/sofia-validation/mobile-login-probe.json; then
              echo "Mobile API v138 is live."
              exit 0
            fi
            sleep 10
          done
          echo "Production did not reach mobile API v138 in time." >&2
          cat /tmp/sofia-validation/live-health.json >&2 || true
          cat /tmp/sofia-validation/mobile-login-probe.json >&2 || true
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sofia-backend-validation
          path: /tmp/sofia-validation/
          if-no-files-found: warn
