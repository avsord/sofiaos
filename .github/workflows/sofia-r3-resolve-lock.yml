name: Sofia R3 resolve Expo SDK 57 plugin lock (isolated)
'on':
  push:
    branches: [test/sofia-r3-expo-lock-20261010]
    paths: [.github/workflows/sofia-r3-resolve-lock.yml]
permissions:
  contents: write
jobs:
  resolve:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SOFIA_APP/package-lock.json
      - name: Use Expo CLI to install the SDK-matched native config plugin
        working-directory: SOFIA_APP
        run: |
          set -euo pipefail
          npm ci
          npx expo install expo-build-properties --npm
          npm ci
          node -e "const p=require('./node_modules/expo-build-properties/package.json');const c=require('./package.json');if(!c.dependencies['expo-build-properties'])throw Error('Plugin missing');console.log('expo-build-properties',p.version)"
      - name: Commit exact SDK-generated lock only to this isolated branch
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name "Sofia Expo dependency resolver"
          git config user.email "sofia-expo-resolver@users.noreply.github.com"
          git add -- SOFIA_APP/package.json SOFIA_APP/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "deps(ci): lock Expo SDK 57 native build properties"
          git push origin HEAD:refs/heads/test/sofia-r3-expo-lock-20261010
      - uses: actions/upload-artifact@v4
        with:
          name: Sofia-r3-expo-sdk57-lock
          path: |
            SOFIA_APP/package.json
            SOFIA_APP/package-lock.json
          retention-days: 7
          if-no-files-found: error
