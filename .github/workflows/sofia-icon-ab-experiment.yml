name: Sofia Android splash icon isolated A-B benchmark
'on':
  push:
    branches:
      - test/sofia-icon-ab-20261010
    paths:
      - .github/workflows/sofia-icon-ab-experiment.yml
      - SOFIA_APP/tools/icon-ab-smoke.py
permissions:
  actions: read
  contents: read
jobs:
  compare_apks:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download exact animated 0.3.104 APK (A)
        uses: actions/download-artifact@v4
        with:
          name: Sofia-build-38023291956-1
          run-id: 38023291956
          github-token: ${{ github.token }}
          path: /tmp/sofia-icon-ab/animated
      - name: Download exact static experimental 0.3.104 APK (B)
        uses: actions/download-artifact@v4
        with:
          name: Sofia-build-38025647495-1
          run-id: 38025647495
          github-token: ${{ github.token }}
          path: /tmp/sofia-icon-ab/static
      - name: Restore synthetic fixture for offline account
        uses: actions/download-artifact@v4
        with:
          name: Sofia-build-37809157208-1
          run-id: 37809157208
          github-token: ${{ github.token }}
          path: /tmp/sofia-icon-ab/seed
      - name: Confirm the two expected signed source binaries
        run: |
          echo 'faed6a165000b503d6a6382067766dfce0bb356006a8533571aecc624f298315  /tmp/sofia-icon-ab/animated/Sofia-OS.apk' | sha256sum -c
          echo '7dd4c199c932e5b0dd00f4ed0b95010f56bd4eefc962d9a007781151f6247df2  /tmp/sofia-icon-ab/static/Sofia-OS.apk' | sha256sum -c
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Measure both variants on the same isolated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          disable-animations: false
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          script: python3 SOFIA_APP/tools/icon-ab-smoke.py
      - name: Keep the raw A/B evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sofia-icon-AB-${{ github.run_id }}
          path: /tmp/sofia-icon-ab-evidence/
          if-no-files-found: warn
          retention-days: 30
