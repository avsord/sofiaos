name: Sofia filter sync validation
on:
  push:
    branches: [sofia-filter-sync]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: node --check src/core/runtime.js
      - run: node --check src/channels/mobile.js
