name: Sofia Android 0.3.24 update
on:
  workflow_dispatch:
  push:
    branches: [work/sofia-native-024]
    paths:
      - .github/workflows/sofia-native-024-update.yml
      - tools/release024/apply.cjs
permissions:
  contents: write
concurrency:
  group: sofia-android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://sofiaos.up.railway.app
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Apply complete source delta with transport and per-file hashes
        run: node tools/release024/apply.cjs
      - name: Retain source transport audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sofia-024-delivery
          path: tools/release024/
          retention-days: 30
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SOFIA_APP/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked app dependencies and rebuild existing vector icon
        working-directory: SOFIA_APP
        run: |
          npm ci
          npm install --prefix /tmp/sofia-icon-tools --no-save --package-lock=false sharp@0.34.1
          NODE_PATH=/tmp/sofia-icon-tools/node_modules npm run prepare-assets
      - name: Typecheck and complete app regressions
        working-directory: SOFIA_APP
        run: |
          set -euo pipefail
          mkdir -p dist
          npm run check | tee dist/typecheck.txt
          npm test | tee dist/app-tests.txt
          node -e "const c=require('./app.json').expo;if(c.version!=='0.3.24'||c.android.versionCode!==29||c.android.package!=='com.avsord.sofiaapp')throw Error('Unexpected update identity')"
      - name: Commit exact validated source and preserve full master source
        run: |
          git config user.name 'Sofia build'
          git config user.email 'sofia-build@users.noreply.github.com'
          git add -- SOFIA_APP docs/entregas/0.3.24
          if ! git diff --cached --quiet; then
            git commit -m 'fix(android): drag refresh guard, 50-50 agenda and anchored notifications 0.3.24'
            git push origin HEAD:refs/heads/work/sofia-native-024
          fi
          git rev-parse HEAD > SOFIA_APP/dist/SOURCE_COMMIT.txt
          git archive --format=zip --output=SOFIA_APP/dist/Sofia-OS-0.3.24-source.zip HEAD
          cp tools/release024/audit.json SOFIA_APP/dist/source-audit.json
      - name: Verify existing server without restarting or changing its data
        run: |
          curl -fsS --max-time 30 https://sofiaos.up.railway.app/health > SOFIA_APP/dist/server-health.json
          node -e "const h=require('./SOFIA_APP/dist/server-health.json');if(!h.ok||Number(h.version.split('.')[0])<142)throw Error('Incompatible server');console.log('Existing server preserved:',h.version)"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build standalone production APK
        working-directory: SOFIA_APP
        run: |
          npx expo prebuild --platform android --clean --no-install
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Verify identity, bundled JavaScript and same signature as 0.3.23
        working-directory: SOFIA_APP
        run: |
          set -euo pipefail
          mkdir -p dist /tmp/sofia-baseline
          gh release download sofia-android-v0.3.23 --repo "$GITHUB_REPOSITORY" --pattern Sofia-OS.apk --dir /tmp/sofia-baseline
          cp android/app/build/outputs/apk/release/app-release.apk dist/Sofia-OS.apk
          SDK_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs /tmp/sofia-baseline/Sofia-OS.apk > /tmp/baseline-signature.txt
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs dist/Sofia-OS.apk > dist/signature.txt
          BASE_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/baseline-signature.txt)"
          NEW_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/signature.txt)"
          test -n "$BASE_CERT" && test "$BASE_CERT" = "$NEW_CERT"
          "$SDK_TOOLS/aapt" dump badging dist/Sofia-OS.apk > dist/manifest.txt
          grep -q "package: name='com.avsord.sofiaapp' versionCode='29' versionName='0.3.24'" dist/manifest.txt
          unzip -p dist/Sofia-OS.apk assets/index.android.bundle > /tmp/sofia-release.bundle
          test -s /tmp/sofia-release.bundle
          ! grep -aq SOFIA_NATIVE_PAGER_FIXTURE_ONLY /tmp/sofia-release.bundle
          sha256sum dist/Sofia-OS.apk > dist/Sofia-OS.apk.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install over 0.3.23 and verify stable startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: |
            adb install /tmp/sofia-baseline/Sofia-OS.apk
            adb install -r SOFIA_APP/dist/Sofia-OS.apk
            adb logcat -c
            adb shell am start -W -n com.avsord.sofiaapp/.MainActivity
            sleep 15
            adb shell pidof com.avsord.sofiaapp > /tmp/sofia-pid-before
            sleep 20
            adb shell pidof com.avsord.sofiaapp > /tmp/sofia-pid-after
            test -s /tmp/sofia-pid-before && cmp /tmp/sofia-pid-before /tmp/sofia-pid-after
            adb logcat -d -s ReactNativeJS:E AndroidRuntime:E > SOFIA_APP/dist/native-errors.txt
            ! grep -q 'FATAL EXCEPTION' SOFIA_APP/dist/native-errors.txt
            adb shell uiautomator dump /sdcard/sofia-ui.xml
            adb pull /sdcard/sofia-ui.xml SOFIA_APP/dist/startup.xml
            grep -q 'Entrar' SOFIA_APP/dist/startup.xml
            adb exec-out screencap -p > SOFIA_APP/dist/startup.png
      - name: Publish exact checked APK on existing update channel
        working-directory: SOFIA_APP
        run: node tools/publish-release.cjs
      - name: Verify published APK discovery with both installed and new updater
        working-directory: SOFIA_APP
        run: |
          set -euo pipefail
          git show 09d780de80757de98215ace90a5068232b8ecdad:SOFIA_APP/src/lib/update.ts > /tmp/sofia-023-updater.ts
          node <<'NODE' | tee dist/update-discovery.txt
          const fs=require('fs'),ts=require('typescript'),vm=require('vm');
          (async()=>{for(const file of ['/tmp/sofia-023-updater.ts','src/lib/update.ts']){
            const exports={};const code=ts.transpileModule(fs.readFileSync(file,'utf8'),{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.CommonJS}}).outputText;
            vm.runInNewContext(code,{exports,fetch,AbortController,setTimeout,clearTimeout,Date,Error,Promise});
            const result=await exports.checkForUpdate({currentVersion:'0.3.23'});
            if(result?.version!=='0.3.24')throw Error('Update not discoverable: '+file);
            console.log('VERIFIED',file,result.version,result.url);
          }})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Upload APK, complete source and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sofia-Android-0.3.24
          path: SOFIA_APP/dist/
          if-no-files-found: warn
          retention-days: 30
