name: Sofia R8 workbench - baseline diagnosis
'on':
  push:
    branches: [work/sofia-r8-definitiva-20261010]
    paths: [.github/workflows/sofia-r8-workbench.yml]
permissions:
  contents: read
  actions: read
jobs:
  node_tools:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retain locked React lifecycle testing tools
        run: |
          npm install --prefix /tmp/r8-react --no-save --package-lock=false react@19.2.3 react-test-renderer@19.2.3 typescript@6.0.3
          cd /tmp/r8-react
          tar czf /tmp/R8-react-tools.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: Sofia-R8-react-tools
          path: /tmp/R8-react-tools.tar.gz
          retention-days: 7
  reproduce:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Sofia-build-38093721486-1
          run-id: 38093721486
          github-token: ${{ github.token }}
          path: SOFIA_APP/dist
      - name: Reuse the verified R7.1 binary, not a new candidate
        run: |
          echo 'ea7f6bb3cca881e9520adc198415d9171aa14c946364681b30e7f3909c3ccf8f  SOFIA_APP/dist/Sofia-OS.apk' | sha256sum -c
          echo 'f72d180d36be1981f85e68f6ef99702a8488dc0567b0db39591ede32b8b81a1b  SOFIA_APP/dist/QA-ONLY-manual-universal.apk' | sha256sum -c
          python3 - <<'PY'
          from pathlib import Path
          p=Path('SOFIA_APP/tools/fluency-heavy-smoke.py')
          s=p.read_text()
          prefix=s.rsplit('\ntry:\n',1)[0]
          runner='''
try:
 for key in ['window_animation_scale','transition_animation_scale','animator_duration_scale']:adb('shell','settings','put','global',key,'1')
 adb('shell','svc','wifi','disable');adb('shell','svc','data','disable');adb('shell','cmd','connectivity','airplane-mode','enable')
 seed('new');adb('logcat','-c');start();wait_data();time.sleep(2)
 tree=xml();points={label:point(tree,label) for label in ['Início','Páginas','Conversa','Agenda','Apps','Perfil']}
 correctness(points,'new')
 RESULT['correctness_passed']=True
finally:
 (OUT/'after-editor-all.log').write_text(adb('logcat','-d','-v','threadtime'))
 (OUT/'after-editor-react.log').write_text(collect_logs())
 try:(OUT/'after-editor.xml').write_text(xml())
 except Exception:pass
 (OUT/'baseline-diagnosis.json').write_text(json.dumps(RESULT,indent=2,ensure_ascii=False))
'''
          p.write_text(prefix+'\n'+runner)
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reproduce editor crash and retain post-error logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          disable-animations: false
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          script: python3 SOFIA_APP/tools/fluency-heavy-smoke.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sofia-R8-baseline-crash
          path: SOFIA_APP/dist/fluency-evidence/
          retention-days: 14
          if-no-files-found: error
