name: Sofia 0.3.54 repair validation
on:
  push:
    branches: [fix/profile-history-startup-054]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4d41d6ea6657478bdc2c667cf54a56f11829f781
      - name: Package exact live source for regression diagnosis
        run: git archive --format=tar.gz -o sofia-live-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: sofia-live-source-054
          path: sofia-live-source.tar.gz
          retention-days: 3
