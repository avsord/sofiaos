name: Sofia 0.3.54 repair validation
on:
  push:
    branches: [fix/profile-history-startup-054]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sofia-repair-054-validation
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: repair
      - uses: actions/checkout@v4
        with:
          ref: 7b55928c2bc8b157c9391939668bda19adaf16d6
          path: source
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Apply checksum-verified backend changes without modifying the APK
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('source').resolve()
          allowed={'src/memory/store.js','src/services/chat-sync.js','src/core/runtime.js','tests/history-shutdown-recovery-054.test.cjs'}
          digest=lambda text:hashlib.sha256(text.encode()).hexdigest()
          payload=json.loads(Path('repair/tools/repair054-backend.json').read_text())['files']
          assert {x['path'] for x in payload}==allowed
          for item in payload:
            path=root/item['path']
            text=path.read_text() if path.exists() else ''
            assert digest(text)==item['before'],'Base mismatch: '+item['path']
            for start,end,replacement in reversed(item['edits']):
              text=text[:start]+replacement+text[end:]
            assert digest(text)==item['after'],'Result mismatch: '+item['path']
            path.write_text(text)
          PY
          git -C source diff --check
          git -C source diff --exit-code -- SOFIA_APP
      - name: Run all backend tests with isolated temporary databases
        working-directory: source
        run: |
          set -euo pipefail
          npm ci
          npm test | tee backend-history-054.log
      - name: Commit only verified recovery code; do not deploy before review
        working-directory: source
        run: |
          git config user.name 'Sofia repair validation'
          git config user.email 'sofia-build@users.noreply.github.com'
          git add src/memory/store.js src/services/chat-sync.js src/core/runtime.js tests/history-shutdown-recovery-054.test.cjs
          git commit -m 'fix(history): preserve shutdown conversations and recover legacy pauses after backup'
          git push origin HEAD:refs/heads/fix/verified-history-recovery-054
          git rev-parse HEAD > VERIFIED_BACKEND_SOURCE.txt
          git archive --format=tar.gz -o verified-history-source-054.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sofia-054-history-validation
          path: |
            source/backend-history-054.log
            source/VERIFIED_BACKEND_SOURCE.txt
            source/verified-history-source-054.tar.gz
          retention-days: 7
