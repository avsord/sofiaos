name: Sofia Android 0.3.23 update
on:
  workflow_dispatch:
  push:
    branches: [work/md-alteracoes-1-10]
    paths:
      - .github/workflows/sofia-native-023-update.yml
      - tools/md-release-023/apply.cjs
permissions:
  contents: write
concurrency:
  group: sofia-android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://sofiaos.up.railway.app
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Apply exact source with transport and per-file checksums
        run: node tools/md-release-023/apply.cjs
      - name: Retain transport audit for recoverable interrupted submissions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sofia-023-delivery
          path: tools/md-release-023/
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install locked app dependencies and rebuild existing vector icon
        working-directory: SOFIA_APP
        run: |
          npm ci
          npm install --prefix /tmp/sofia-icon-tools --no-save --package-lock=false sharp@0.34.1
          NODE_PATH=/tmp/sofia-icon-tools/node_modules npm run prepare-assets
      - name: Typecheck and full app regression suite including old-server compatibility
        working-directory: SOFIA_APP
        run: |
          npm run check
          npm test
          node -e "const c=require('./app.json').expo;if(c.version!=='0.3.23'||c.android.versionCode!==28||c.android.package!=='com.avsord.sofiaapp')throw Error('Unexpected update identity')"
      - name: Retain exact validated source before native build
        run: |
          git config user.name 'Sofia build'
          git config user.email 'sofia-build@users.noreply.github.com'
          git add -- SOFIA_APP
          if ! git diff --cached --quiet; then
            git commit -m 'feat(android): validated MD native update with v142 compatibility'
            git push origin HEAD:refs/heads/work/md-alteracoes-1-10
          fi
          mkdir -p SOFIA_APP/dist
          git rev-parse HEAD > SOFIA_APP/dist/SOURCE_COMMIT.txt
          git status --porcelain -- SOFIA_APP
      - name: Confirm existing server remains online without any redeploy
        run: |
          curl -fsS --max-time 30 https://sofiaos.up.railway.app/health > /tmp/sofia-health.json
          node -e "const h=require('/tmp/sofia-health.json');if(!h.ok||Number(h.version.split('.')[0])<142)throw Error('Incompatible server');console.log('Existing server',h.version,'preserved')"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build standalone production APK
        working-directory: SOFIA_APP
        run: |
          npx expo prebuild --platform android --clean --no-install
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Verify package, bundled code and same signature as 0.3.22
        working-directory: SOFIA_APP
        run: |
          set -euo pipefail
          mkdir -p dist /tmp/sofia-baseline
          gh release download sofia-android-v0.3.22 --repo "$GITHUB_REPOSITORY" --pattern Sofia-OS.apk --dir /tmp/sofia-baseline
          cp android/app/build/outputs/apk/release/app-release.apk dist/Sofia-OS.apk
          SDK_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)"
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs /tmp/sofia-baseline/Sofia-OS.apk > /tmp/baseline-signature.txt
          "$SDK_TOOLS/apksigner" verify --verbose --print-certs dist/Sofia-OS.apk > dist/signature.txt
          BASE_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/baseline-signature.txt)"
          NEW_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/signature.txt)"
          test -n "$BASE_CERT" && test "$BASE_CERT" = "$NEW_CERT"
          "$SDK_TOOLS/aapt" dump badging dist/Sofia-OS.apk > dist/manifest.txt
          grep -q "package: name='com.avsord.sofiaapp' versionCode='28' versionName='0.3.23'" dist/manifest.txt
          unzip -p dist/Sofia-OS.apk assets/index.android.bundle > /tmp/sofia-release.bundle
          test -s /tmp/sofia-release.bundle
          ! grep -aq SOFIA_NATIVE_PAGER_FIXTURE_ONLY /tmp/sofia-release.bundle
          sha256sum dist/Sofia-OS.apk > dist/Sofia-OS.apk.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install over published app and verify stable startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: |
            adb install /tmp/sofia-baseline/Sofia-OS.apk
            adb install -r SOFIA_APP/dist/Sofia-OS.apk
            adb logcat -c
            adb shell am start -W -n com.avsord.sofiaapp/.MainActivity
            sleep 15
            adb shell pidof com.avsord.sofiaapp > /tmp/sofia-pid-before
            sleep 20
            adb shell pidof com.avsord.sofiaapp > /tmp/sofia-pid-after
            test -s /tmp/sofia-pid-before && cmp /tmp/sofia-pid-before /tmp/sofia-pid-after
            adb logcat -d -s ReactNativeJS:E AndroidRuntime:E > SOFIA_APP/dist/native-errors.txt
            ! grep -q 'FATAL EXCEPTION' SOFIA_APP/dist/native-errors.txt
            adb shell uiautomator dump /sdcard/sofia-ui.xml
            adb pull /sdcard/sofia-ui.xml SOFIA_APP/dist/startup.xml
            grep -q 'Entrar' SOFIA_APP/dist/startup.xml
            adb exec-out screencap -p > SOFIA_APP/dist/startup.png
      - name: Publish exact checked APK on existing update channel
        working-directory: SOFIA_APP
        run: node tools/publish-release.cjs
      - name: Verify installed 0.3.22 updater discovers 0.3.23
        working-directory: SOFIA_APP
        run: |
          git show 7919bbca82acca36028e95522f26042c7ab37428:SOFIA_APP/src/lib/update.ts > /tmp/sofia-022-updater.ts
          node <<'NODE'
          const fs=require('fs'),ts=require('typescript'),vm=require('vm');
          (async()=>{for(const file of ['/tmp/sofia-022-updater.ts','src/lib/update.ts']){
            const exports={};const code=ts.transpileModule(fs.readFileSync(file,'utf8'),{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.CommonJS}}).outputText;
            vm.runInNewContext(code,{exports,fetch,AbortController,setTimeout,clearTimeout,Date,Error,Promise});
            const result=await exports.checkForUpdate({currentVersion:'0.3.22'});
            if(result?.version!=='0.3.23')throw Error('Update not discoverable: '+file);
            console.log('VERIFIED',file,result.version,result.url);
          }})().catch(e=>{console.error(e);process.exitCode=1});
          NODE
      - name: Upload APK and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sofia-Android-0.3.23
          path: SOFIA_APP/dist/
          if-no-files-found: warn
          retention-days: 30
