name: Sofia Android APK
on:
  workflow_dispatch:
  push:
    branches: [sofia-app-android]
    paths:
      - 'SOFIA_APP/**'
      - '.github/workflows/sofia-android-apk.yml'
permissions:
  contents: write
concurrency:
  group: sofia-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: SOFIA_APP
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://sofiaos.up.railway.app
    steps:
      - name: Checkout isolated app branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply checked source normalization
        run: node tools/normalize-source.cjs
      - name: Install locked dependencies
        run: npm ci
      - name: Full TypeScript validation
        run: npm run check
      - name: Application and updater regression tests
        run: npm test
      - name: Persist validated source and lock without overwriting concurrent changes
        run: |
          cd ..
          git config user.name 'Sofia build'
          git config user.email 'sofia-build@users.noreply.github.com'
          git add -- SOFIA_APP
          if ! git diff --cached --quiet; then
            git commit -m 'build: normalize validated Android version metadata [skip ci]'
            git push origin HEAD:refs/heads/sofia-app-android
          fi
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean
      - name: Build standalone internal APK with bundled JavaScript
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Stage APK and verify embedded bundle
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Sofia-OS.apk
          unzip -l dist/Sofia-OS.apk | grep -E 'assets/index.android.bundle|assets/.*\.bundle'
          sha256sum dist/Sofia-OS.apk > dist/Sofia-OS.apk.sha256
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          printf 'Release-mode JavaScript bundle; existing development signing certificate. Not a Play Store production release.\n' > dist/BUILD_SCOPE.txt
      - name: Enable KVM for Android smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install over 0.3.9 then 0.3.10 and launch without Metro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p SOFIA_APP/dist
            sh -lc 'curl -fsSL "https://github.com/avsord/sofiaos/releases/download/sofia-android-v0.3.9/Sofia-OS.apk" -o /tmp/Sofia-0.3.9.apk && curl -fsSL "https://github.com/avsord/sofiaos/releases/download/sofia-android-v0.3.10/Sofia-OS.apk" -o /tmp/Sofia-0.3.10.apk && adb install /tmp/Sofia-0.3.9.apk && adb install -r /tmp/Sofia-0.3.10.apk && adb install -r SOFIA_APP/dist/Sofia-OS.apk'
            adb logcat -c
            adb shell am start -W -n com.avsord.sofiaapp/.MainActivity
            sleep 20
            adb shell pidof com.avsord.sofiaapp
            adb shell uiautomator dump /sdcard/sofia-login.xml
            adb pull /sdcard/sofia-login.xml SOFIA_APP/dist/login-ui.xml
            adb exec-out screencap -p > SOFIA_APP/dist/login-screen.png
            adb logcat -d -s ReactNativeJS:E AndroidRuntime:E > SOFIA_APP/dist/native-errors.txt
            ! grep -q 'FATAL EXCEPTION' SOFIA_APP/dist/native-errors.txt
            grep -q 'Sofia OS' SOFIA_APP/dist/login-ui.xml
            grep -q 'Entrar' SOFIA_APP/dist/login-ui.xml
      - name: Require the compatible chat-sync server before publishing
        run: |
          curl --fail --silent --show-error --max-time 20 https://sofiaos.up.railway.app/health > /tmp/sofia-health.json
          node -e "const h=require('/tmp/sofia-health.json');if(!h.ok||Number(h.version.split('.')[0])<141)throw Error('Compatible server not deployed');console.log(h)"
      - name: Publish exact tested APK and verify latest discovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/publish-release.cjs
      - name: Check actual public update discovery with the application code
        run: |
          node <<'NODE'
          const fs=require('node:fs'),ts=require('typescript'),vm=require('node:vm');
          const exports={};
          const source=ts.transpileModule(fs.readFileSync('src/lib/update.ts','utf8'),{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.CommonJS}}).outputText;
          vm.runInNewContext(source,{exports,fetch,AbortController,setTimeout,clearTimeout,Date,Error,Promise});
          (async()=>{const version=require('./package.json').version;for(const old of ['0.3.9','0.3.10']){const next=await exports.checkForUpdate({currentVersion:old});if(next?.version!==version)throw Error('Public updater does not offer '+version+' from '+old);console.log(old,'->',next.version,next.url);}})().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
      - name: Upload APK and smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sofia-Android-APK
          path: SOFIA_APP/dist/
          if-no-files-found: warn
          retention-days: 30
      - name: Pack exact source and dependency lock
        if: always()
        run: |
          cd ..
          zip -q -r /tmp/Sofia-app-source.zip SOFIA_APP -x '*/node_modules/*' '*/android/*' '*/.expo/*' '*/dist/*' '*.keystore' '*.jks'
      - name: Retain source build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sofia-app-source-validated
          path: /tmp/Sofia-app-source.zip
          retention-days: 30
