name: Sofia Android APK
on:
  workflow_dispatch:
  push:
    branches: [sofia-app-android]
    paths:
      - 'SOFIA_APP/**'
      - '.github/workflows/sofia-android-apk.yml'
permissions:
  contents: write
concurrency:
  group: sofia-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: SOFIA_APP
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://sofiaos.up.railway.app
    steps:
      - name: Checkout isolated app branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply checked source normalization
        run: node tools/normalize-source.cjs
      - name: Install locked dependencies
        run: npm ci
      - name: Full TypeScript validation
        run: npm run check
      - name: Application unit tests
        run: npm test
      - name: Persist normalized source on app branch only
        run: |
          cd ..
          git config user.name 'Sofia build'
          git config user.email 'sofia-build@users.noreply.github.com'
          git add -- SOFIA_APP/package.json SOFIA_APP/package-lock.json SOFIA_APP/app.json SOFIA_APP/src
          if ! git diff --cached --quiet; then
            git commit -m 'fix: align native task priority and backend readiness messages [skip ci]'
            git push origin HEAD:refs/heads/sofia-app-android
          fi
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build standalone internal APK with bundled JavaScript
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Stage APK and verify embedded bundle
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Sofia-OS.apk
          unzip -l dist/Sofia-OS.apk | grep -E 'assets/index.android.bundle|assets/.*\.bundle'
          sha256sum dist/Sofia-OS.apk > dist/Sofia-OS.apk.sha256
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          printf 'Internal validation build. Release-mode JavaScript bundle; development signing certificate. Not a Play Store production release.\n' > dist/BUILD_SCOPE.txt
      - name: Enable KVM for Android smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch without Metro on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p SOFIA_APP/dist
            if [ "${{ github.run_number }}" = "5" ]; then
              curl -L -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/11181864125/zip" -o /tmp/sofia-previous.zip
              mkdir -p /tmp/sofia-previous && unzip -q /tmp/sofia-previous.zip -d /tmp/sofia-previous
              PREV=$(find /tmp/sofia-previous -name '*.apk' | head -n 1)
              test -n "$PREV"
              adb install "$PREV"
              adb install -r SOFIA_APP/dist/Sofia-OS.apk
            else
              adb install SOFIA_APP/dist/Sofia-OS.apk
            fi
            adb logcat -c
            adb shell am start -W -n com.avsord.sofiaapp/.MainActivity
            sleep 20
            adb shell pidof com.avsord.sofiaapp
            adb shell uiautomator dump /sdcard/sofia-login.xml
            adb pull /sdcard/sofia-login.xml SOFIA_APP/dist/login-ui.xml
            adb exec-out screencap -p > SOFIA_APP/dist/login-screen.png
            adb logcat -d -s ReactNativeJS:E AndroidRuntime:E > SOFIA_APP/dist/native-errors.txt
            ! grep -q 'FATAL EXCEPTION' SOFIA_APP/dist/native-errors.txt
            grep -q 'Sofia OS' SOFIA_APP/dist/login-ui.xml
            grep -q 'Entrar' SOFIA_APP/dist/login-ui.xml
      - name: Publish direct-update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="sofia-android-v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Sofia-OS.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/Sofia-OS.apk --repo "$GITHUB_REPOSITORY" --title "Sofia OS Android ${VERSION}" --notes "Atualização direta da Sofia OS para Android. Instalação exige confirmação do sistema."
          fi
      - name: Upload APK and smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sofia-Android-APK
          path: SOFIA_APP/dist/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload exact source and dependency lock
        if: always()
        run: |
          cd ..
          zip -q -r /tmp/Sofia-app-source.zip SOFIA_APP -x '*/node_modules/*' '*/android/*' '*/.expo/*' '*/dist/*' '*.keystore' '*.jks'
      - name: Retain source build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sofia-app-source-validated
          path: /tmp/Sofia-app-source.zip
          retention-days: 30
