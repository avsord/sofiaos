name: Sofia Android APK
on:
  workflow_dispatch:
  push:
    branches: [sofia-app-android]
    paths:
      - 'SOFIA_APP/**'
      - 'tools/releases/0.3.10/**'
      - '.github/workflows/sofia-android-apk.yml'
permissions:
  contents: write
concurrency:
  group: sofia-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: SOFIA_APP
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://sofiaos.up.railway.app
    steps:
      - name: Checkout isolated app branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply checksum-verified 0.3.10 release source once
        run: |
          if [ "$(node -p "require('./package.json').version")" = '0.3.9' ]; then
            node ../tools/releases/0.3.10/apply.cjs app ..
          fi
      - name: Apply checked source normalization
        run: node tools/normalize-source.cjs
      - name: Resolve the added image picker into the dependency lock
        run: |
          if ! node -e "const p=require('./package-lock.json');process.exit(p.packages?.['node_modules/expo-image-picker']?0:1)"; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Full TypeScript validation
        run: npm run check
      - name: Application unit tests
        run: npm test
      - name: Persist complete validated source and dependency lock on app branch only
        run: |
          cd ..
          git config user.name 'Sofia build'
          git config user.email 'sofia-build@users.noreply.github.com'
          git add -- SOFIA_APP
          if ! git diff --cached --quiet; then
            git commit -m 'release: validated Sofia Android 0.3.10 source and locked dependencies [skip ci]'
            git push origin HEAD:refs/heads/sofia-app-android
          fi
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build standalone internal APK with bundled JavaScript
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Stage APK and verify embedded bundle
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Sofia-OS.apk
          unzip -l dist/Sofia-OS.apk | grep -E 'assets/index.android.bundle|assets/.*\.bundle'
          sha256sum dist/Sofia-OS.apk > dist/Sofia-OS.apk.sha256
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          printf 'Internal validation build. Release-mode JavaScript bundle; development signing certificate. Not a Play Store production release.\n' > dist/BUILD_SCOPE.txt
      - name: Enable KVM for Android smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install over 0.3.9 and launch without Metro on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p SOFIA_APP/dist
            sh -lc 'curl -fsSL "https://github.com/avsord/sofiaos/releases/download/sofia-android-v0.3.9/Sofia-OS.apk" -o /tmp/Sofia-OS-0.3.9.apk && adb install /tmp/Sofia-OS-0.3.9.apk && adb install -r SOFIA_APP/dist/Sofia-OS.apk'
            adb logcat -c
            adb shell am start -W -n com.avsord.sofiaapp/.MainActivity
            sleep 20
            adb shell pidof com.avsord.sofiaapp
            adb shell uiautomator dump /sdcard/sofia-login.xml
            adb pull /sdcard/sofia-login.xml SOFIA_APP/dist/login-ui.xml
            adb exec-out screencap -p > SOFIA_APP/dist/login-screen.png
            adb logcat -d -s ReactNativeJS:E AndroidRuntime:E > SOFIA_APP/dist/native-errors.txt
            ! grep -q 'FATAL EXCEPTION' SOFIA_APP/dist/native-errors.txt
            grep -q 'Sofia OS' SOFIA_APP/dist/login-ui.xml
            grep -q 'Entrar' SOFIA_APP/dist/login-ui.xml
      - name: Require the compatible chat-sync server before publishing
        run: |
          for i in $(seq 1 30); do
            body=$(curl --silent --show-error --max-time 15 https://sofiaos.up.railway.app/health || true)
            echo "$body"
            echo "$body" | grep -q '"version":"141.0.0"' && exit 0
            sleep 10
          done
          echo 'Compatible server is not confirmed; refusing to publish an incomplete update.'
          exit 1
      - name: Publish direct-update release from the actual validated app commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="sofia-android-v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Sofia-OS.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/Sofia-OS.apk --target "$(git rev-parse HEAD)" --repo "$GITHUB_REPOSITORY" --title "Sofia OS Android ${VERSION}" --notes-file RELEASE_0.3.10.md
          fi
      - name: Upload APK and smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sofia-Android-APK
          path: SOFIA_APP/dist/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload exact source and dependency lock
        if: always()
        run: |
          cd ..
          zip -q -r /tmp/Sofia-app-source.zip SOFIA_APP -x '*/node_modules/*' '*/android/*' '*/.expo/*' '*/dist/*' '*.keystore' '*.jks'
      - name: Retain source build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sofia-app-source-validated
          path: /tmp/Sofia-app-source.zip
          retention-days: 30
