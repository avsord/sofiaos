name: Sofia Android APK

on:
  workflow_dispatch:
  push:
    branches: [sofia-app-android]
    paths:
      - 'SOFIA_APP/**'
      - '.github/workflows/sofia-android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: SOFIA_APP
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: SOFIA_APP/package-lock.json

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Generate Android project
        env:
          EXPO_PUBLIC_API_URL: https://sofiaos.up.railway.app
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build installable APK
        env:
          EXPO_PUBLIC_API_URL: https://sofiaos.up.railway.app
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Sofia.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sofia-Android-APK
          path: SOFIA_APP/dist/Sofia.apk
          if-no-files-found: error
          retention-days: 30
