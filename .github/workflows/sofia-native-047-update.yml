# Build once; run every native check in parallel; publish only the identical verified APK.
name: Sofia Android - APK de teste e publicacao aprovada
'on':
  workflow_dispatch: null
  push:
    branches:
    - sofia-app-android
    paths:
    - .github/workflows/sofia-native-047-update.yml
    - SOFIA_APP/**
permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: read
# Concurrency is job-scoped: superseded builds are disposable; publication is not.
env:
  CI: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  EXPO_NO_TELEMETRY: '1'
  EXPO_PUBLIC_API_URL: https://sofiaos.up.railway.app
  GH_TOKEN: ${{ github.token }}
  SOFIA_MANUAL_NO_TESTS: ${{ contains(github.event.head_commit.message, '[manual-apk]') && contains(github.event.head_commit.message, '[no-tests]') }}
jobs:
  build:
    # A newer build may replace an obsolete build, never a publishing release.
    concurrency:
      group: sofia-android-build-${{ github.ref }}
      cancel-in-progress: true
    if: github.ref == 'refs/heads/sofia-app-android'
    name: Build once and retain checked APKs
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      version_code: ${{ steps.plan.outputs.version_code }}
      baseline_version: ${{ steps.plan.outputs.baseline_version }}
      baseline_tag: ${{ steps.plan.outputs.baseline_tag }}
      reason: ${{ steps.plan.outputs.reason }}
      source_sha: ${{ steps.source.outputs.sha }}
      artifact_name: Sofia-build-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.sha }}
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: |-
          SOFIA_APP/package-lock.json
          package-lock.json
    - name: Plan compatible delivery and verify parallel test contracts
      id: plan
      run: |
        set -euo pipefail
        mkdir -p SOFIA_APP/dist
        if [ "$SOFIA_MANUAL_NO_TESTS" != "true" ]; then
          python3 SOFIA_APP/tools/native-delivery-test.py
          node --test SOFIA_APP/tools/delivery.test.cjs | tee SOFIA_APP/dist/delivery-tests.txt
        else
          printf '%s\n' 'Manual phone candidate: automated tests explicitly skipped at user request; not an approved release.' > SOFIA_APP/dist/manual-delivery.txt
        fi
        node SOFIA_APP/tools/delivery.cjs prepare
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
      if: steps.plan.outputs.release == 'true'
    - name: Install locked app dependencies and rebuild existing vector icon
      working-directory: SOFIA_APP
      run: |
        npm ci
        npm install --prefix /tmp/sofia-icon-tools --no-save --package-lock=false sharp@0.34.1
        NODE_PATH=/tmp/sofia-icon-tools/node_modules npm run prepare-assets
      if: steps.plan.outputs.release == 'true'
    - name: Typecheck capsules, widgets and existing app flows
      working-directory: SOFIA_APP
      run: |
        set -euo pipefail
        mkdir -p dist
        npm run check | tee dist/typecheck.txt
        npm test | tee dist/app-tests.txt
        node -e "const c=require('./app.json').expo;if(c.version!==process.env.SOFIA_RELEASE_VERSION||c.android.versionCode!==Number(process.env.SOFIA_RELEASE_CODE)||c.android.package!=='com.avsord.sofiaapp')throw Error('Unexpected update identity')"
      id: validate
      if: steps.plan.outputs.release == 'true' && env.SOFIA_MANUAL_NO_TESTS != 'true'
    - name: Verify existing task description persistence with isolated backend data
      run: |
        set -euo pipefail
        npm ci
        npm test | tee SOFIA_APP/dist/backend-tests.txt
      id: backend_tests
      if: steps.plan.outputs.release == 'true' && env.SOFIA_MANUAL_NO_TESTS != 'true'
    - name: Preserve exact source being tested
      run: |
        mkdir -p SOFIA_APP/dist
        git config user.name 'Sofia build'
        git config user.email 'sofia-build@users.noreply.github.com'
        git add -- SOFIA_APP
        if ! git diff --cached --quiet; then
          git commit -m "build: prepare validated Android ${SOFIA_RELEASE_VERSION}"
          git push origin HEAD:refs/heads/sofia-app-android
        fi
        git rev-parse HEAD > SOFIA_APP/dist/SOURCE_COMMIT.txt
        git archive --format=zip --output=SOFIA_APP/dist/Sofia-OS-${SOFIA_RELEASE_VERSION}-source.zip HEAD
        printf "sha=%s\n" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      id: source
      if: steps.plan.outputs.release == 'true'
    - name: Verify existing server without restarting or changing its data
      run: |
        curl -fsS --max-time 30 --retry 3 --retry-delay 2 --retry-max-time 60 --dump-header SOFIA_APP/dist/server-health-headers.txt --write-out '%{stderr}health_http=%{http_code} total_seconds=%{time_total}\n' https://sofiaos.up.railway.app/health > SOFIA_APP/dist/server-health.json
        node -e "const h=require('./SOFIA_APP/dist/server-health.json');if(!h.ok||Number(h.version.split('.')[0])<142)throw Error('Incompatible server');console.log('Existing server preserved:',h.version)"
      if: steps.plan.outputs.release == 'true' && env.SOFIA_MANUAL_NO_TESTS != 'true'
    - name: Fail early when the live backend cannot support the app
      run: |
        cp SOFIA_APP/dist/server-health.json SOFIA_APP/dist/server-release-gate.json
        node -e "const h=require('./SOFIA_APP/dist/server-release-gate.json');if(!h.ok||!h.task_description_format||!h.selected_task_context||!h.agenda_priority||!h.persistent_sessions)throw Error('Server publication is required before the APK release; all existing records remain preserved')"
      id: early_server
      if: steps.plan.outputs.release == 'true' && env.SOFIA_MANUAL_NO_TESTS != 'true'
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false
      if: steps.plan.outputs.release == 'true'
    - name: Build standalone production APK
      working-directory: SOFIA_APP
      run: |
        npx expo prebuild --platform android --clean --no-install
        test -f android/app/src/main/res/drawable/sofia_logo.xml
        test -f android/app/src/main/res/values-v31/sofia-splash.xml
        grep -q '^android.enableMinifyInReleaseBuilds=true$' android/gradle.properties
        grep -q '^android.enableShrinkResourcesInReleaseBuilds=true$' android/gradle.properties
        ! find android/app/src/main/res -name splashscreen_logo.png | grep -q .
        grep -q '@drawable/sofia_logo_foreground' android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        cd android
        chmod +x gradlew
        ./gradlew :app:assembleRelease --build-cache --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
        test -s app/build/outputs/mapping/release/mapping.txt
      id: build
      if: steps.plan.outputs.release == 'true'
    - name: Verify package, increasing version code and existing update signature
      working-directory: SOFIA_APP
      run: |
        set -euo pipefail
        mkdir -p dist /tmp/sofia-baseline
        gh release download "$SOFIA_BASELINE_TAG" --repo "$GITHUB_REPOSITORY" --pattern Sofia-OS.apk --dir /tmp/sofia-baseline
        cp android/app/build/outputs/apk/release/app-release.apk dist/Sofia-OS.apk
        SDK_TOOLS="$(python3 -c 'import os,pathlib; p=pathlib.Path(os.environ["ANDROID_HOME"])/"build-tools"; print(max((x for x in p.iterdir() if x.is_dir()), key=lambda x:tuple(int(n) for n in x.name.split(".") if n.isdigit())))')"
        "$SDK_TOOLS/apksigner" verify --verbose --print-certs /tmp/sofia-baseline/Sofia-OS.apk > /tmp/baseline-signature.txt
        "$SDK_TOOLS/apksigner" verify --verbose --print-certs dist/Sofia-OS.apk > dist/signature.txt
        BASE_CERT="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/baseline-signature.txt)"
        NEW_CERT="$(sed -n 's/.*certificate SHA-256 digest: //p' dist/signature.txt)"
        test -n "$BASE_CERT" && test "$BASE_CERT" = "$NEW_CERT"
        "$SDK_TOOLS/aapt" dump badging dist/Sofia-OS.apk > dist/manifest.txt
        grep -q "package: name='com.avsord.sofiaapp' versionCode='${SOFIA_RELEASE_CODE}' versionName='${SOFIA_RELEASE_VERSION}'" dist/manifest.txt
        unzip -p dist/Sofia-OS.apk assets/index.android.bundle > /tmp/sofia-release.bundle
        test -s /tmp/sofia-release.bundle
        ! grep -aq SOFIA_NATIVE_PAGER_FIXTURE_ONLY /tmp/sofia-release.bundle
        ! grep -aq SOFIA_PAGE_TOUCH_FIXTURE_ONLY /tmp/sofia-release.bundle
        ! grep -aq SOFIA_FULL_APP_FIXTURE_ONLY /tmp/sofia-release.bundle
        python3 -c 'import hashlib,pathlib; p=pathlib.Path("dist/Sofia-OS.apk"); print(hashlib.sha256(p.read_bytes()).hexdigest()+"  dist/Sofia-OS.apk")' > dist/Sofia-OS.apk.sha256
        cp /tmp/sofia-baseline/Sofia-OS.apk dist/baseline-Sofia-OS.apk
      id: identity
      if: steps.plan.outputs.release == 'true'
    - name: Build signed emulator-only QA twin without altering ARM64 owner APK
      working-directory: SOFIA_APP
      run: |
        set -euo pipefail
        cd android
        ./gradlew :app:assembleRelease --build-cache --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
        cp app/build/outputs/apk/release/app-release.apk ../dist/QA-ONLY-manual-universal.apk
        cd ..
        python3 tools/verify-abi-equivalence.py
        SDK_TOOLS="$(python3 -c 'import os,pathlib; p=pathlib.Path(os.environ["ANDROID_HOME"])/"build-tools"; print(max((x for x in p.iterdir() if x.is_dir()), key=lambda x:tuple(int(n) for n in x.name.split(".") if n.isdigit())))')"
        "$SDK_TOOLS/apksigner" verify --verbose --print-certs dist/QA-ONLY-manual-universal.apk > /tmp/qa-signature.txt
        test "$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/qa-signature.txt)" = "$(sed -n 's/.*certificate SHA-256 digest: //p' dist/signature.txt)"
      if: steps.plan.outputs.release == 'true' && contains(github.event.head_commit.message, '[manual-apk]') && env.SOFIA_MANUAL_NO_TESTS != 'true'
    - name: Build full production shell with isolated transport for acceptance
      working-directory: SOFIA_APP
      run: |
        set -euo pipefail
        cp App.tsx /tmp/sofia-production-App.tsx
        trap 'cp /tmp/sofia-production-App.tsx App.tsx; rm -f ProductionApp.tsx' EXIT
        cp App.tsx ProductionApp.tsx
        cp tests/fixtures/calendar-performance.tsx.fixture App.tsx
        npm run check
        cd android
        ./gradlew :app:assembleRelease --build-cache --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,x86_64
        cp app/build/outputs/apk/release/app-release.apk /tmp/sofia-full-fixture.apk
        cp /tmp/sofia-full-fixture.apk ../dist/QA-ONLY-full-fixture.apk
        cd ..
        cp /tmp/sofia-production-App.tsx App.tsx
        rm ProductionApp.tsx
        git diff --exit-code -- App.tsx
      id: fixture
      if: steps.plan.outputs.release == 'true' && !contains(github.event.head_commit.message, '[manual-apk]')
    - name: Seal exact production, test and baseline APK bundle
      working-directory: SOFIA_APP
      run: python3 tools/native-shards.py bundle
      id: seal
      if: steps.plan.outputs.release == 'true' && !contains(github.event.head_commit.message, '[manual-apk]')
    - name: Retain compiled APKs for parallel verification and failed-job retries
      id: bundle
      uses: actions/upload-artifact@v4
      with:
        name: Sofia-build-${{ github.run_id }}-${{ github.run_attempt }}
        path: SOFIA_APP/dist/
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
      if: steps.plan.outputs.release == 'true'
    - name: Report delivery outcome
      id: delivery_status
      if: always() && (failure() || steps.plan.outputs.release != 'true')
      continue-on-error: true
      env:
        DELIVERY_STATUS: ${{ job.status }}
        DELIVERY_PLANNED: ${{ steps.plan.outputs.release }}
        DELIVERY_PUBLISHED: skipped
        DELIVERY_VERSION: ${{ steps.plan.outputs.version }}
        DELIVERY_REASON: ${{ steps.plan.outputs.reason }}
        DELIVERY_STEPS: ${{ toJSON(steps) }}
      run: node SOFIA_APP/tools/delivery.cjs report
    - name: Retain build diagnostics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Sofia-build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
        path: |-
          SOFIA_APP/dist/*.txt
          SOFIA_APP/dist/delivery-status.json
        if-no-files-found: warn
        retention-days: 30
  native_tests:
    name: Native checks - ${{ matrix.shard }}
    needs:
    - build
    if: needs.build.outputs.release == 'true' && !contains(github.event.head_commit.message, '[manual-apk]')
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard:
        - navigation
        - workspace
    env:
      SOFIA_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      SOFIA_RELEASE_VERSION: ${{ needs.build.outputs.version }}
      SOFIA_RELEASE_CODE: ${{ needs.build.outputs.version_code }}
      SOFIA_BASELINE_VERSION: ${{ needs.build.outputs.baseline_version }}
      SOFIA_BASELINE_TAG: ${{ needs.build.outputs.baseline_tag }}
      SOFIA_NATIVE_SHARD: ${{ matrix.shard }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ needs.build.outputs.source_sha }}
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Restore exact compiled APKs; do not recompile in test jobs
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build.outputs.artifact_name }}
        path: SOFIA_APP/dist
    - name: Verify build identity and APK hashes before installing
      working-directory: SOFIA_APP
      run: python3 tools/native-shards.py verify-bundle
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Verify upgrade and isolated native acceptance shard
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        arch: x86_64
        target: default
        disable-animations: false
        script: |
          adb shell wm size 720x1600
          adb shell wm density 280
          adb install SOFIA_APP/dist/baseline-Sofia-OS.apk
          adb install -r SOFIA_APP/dist/Sofia-OS.apk
          adb shell pm grant com.avsord.sofiaapp android.permission.POST_NOTIFICATIONS
          adb logcat -c
          adb shell am start -W -n com.avsord.sofiaapp/.MainActivity
          for attempt in $(seq 1 12); do sleep 3; adb shell uiautomator dump /sdcard/startup.xml; adb pull /sdcard/startup.xml SOFIA_APP/dist/startup.xml; grep -q Entrar SOFIA_APP/dist/startup.xml && break; done
          cat SOFIA_APP/dist/startup.xml
          adb exec-out screencap -p > SOFIA_APP/dist/startup.png
          adb logcat -d -s ReactNativeJS:E AndroidRuntime:E > SOFIA_APP/dist/native-errors.txt
          ! grep -q 'FATAL EXCEPTION' SOFIA_APP/dist/native-errors.txt
          grep -q Entrar SOFIA_APP/dist/startup.xml
          adb install -r SOFIA_APP/dist/QA-ONLY-full-fixture.apk
          adb shell pm grant com.avsord.sofiaapp android.permission.POST_NOTIFICATIONS
          adb logcat -c
          adb shell am force-stop com.avsord.sofiaapp
          adb shell am start -W -n com.avsord.sofiaapp/.MainActivity
          cd SOFIA_APP && python3 tools/native-shards.py run --shard "$SOFIA_NATIVE_SHARD"
      id: native_tests
    - name: Report the exact failed native shard
      id: delivery_status
      if: failure()
      continue-on-error: true
      env:
        DELIVERY_STATUS: ${{ job.status }}
        DELIVERY_PLANNED: ${{ needs.build.outputs.release }}
        DELIVERY_PUBLISHED: skipped
        DELIVERY_VERSION: ${{ needs.build.outputs.version }}
        DELIVERY_REASON: Native shard ${{ matrix.shard }} failed; compiled APKs retained for retry
        DELIVERY_STEPS: ${{ toJSON(steps) }}
      run: node SOFIA_APP/tools/delivery.cjs report
    - name: Retain evidence for this isolated shard
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Sofia-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
        path: |-
          SOFIA_APP/dist/performance-evidence/
          SOFIA_APP/dist/startup.*
          SOFIA_APP/dist/native-errors.txt
          SOFIA_APP/dist/delivery-status.json
        if-no-files-found: error
        retention-days: 30
  manual_apk:
    name: Check ARM64 production identity and QA-equivalent runtime on x86 emulator
    needs: build
    if: needs.build.outputs.release == 'true' && contains(github.event.head_commit.message, '[manual-apk]') && !contains(github.event.head_commit.message, '[no-tests]')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ needs.build.outputs.source_sha }}
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build.outputs.artifact_name }}
        path: SOFIA_APP/dist
    - name: Restore retained synthetic seed without rebuilding the app
      uses: actions/download-artifact@v4
      with:
        name: Sofia-build-37809157208-1
        run-id: 37809157208
        github-token: ${{ github.token }}
        path: SOFIA_APP/dist/seed-060
    - name: Restore exact previously delivered production APK for comparison
      uses: actions/download-artifact@v4
      with:
        name: Sofia-build-37838702548-1
        run-id: 37838702548
        github-token: ${{ github.token }}
        path: SOFIA_APP/dist/previous-063
    - name: Restore the APK currently installed by the owner for timing comparison
      uses: actions/download-artifact@v4
      with:
        name: Sofia-build-37977881730-1
        run-id: 37977881730
        github-token: ${{ github.token }}
        path: SOFIA_APP/dist/previous-094
    - name: Verify exact candidate source and bytes
      working-directory: SOFIA_APP
      env:
        SOFIA_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      run: |
        test "$(cat dist/SOURCE_COMMIT.txt)" = "$SOFIA_SOURCE_SHA"
        test "$(git rev-parse HEAD)" = "$SOFIA_SOURCE_SHA"
        sha256sum -c dist/Sofia-OS.apk.sha256
        test ! -e dist/QA-ONLY-full-fixture.apk
        test -s dist/QA-ONLY-manual-universal.apk
        python3 tools/verify-abi-equivalence.py
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Compare QA-equivalent offline authenticated startup and verify retained conversation
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        arch: x86_64
        target: default
        disable-animations: false
        emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
        script: python3 SOFIA_APP/tools/manual-apk-smoke.py
    - name: Retain manual candidate evidence without publication
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Sofia-manual-${{ github.run_id }}-${{ github.run_attempt }}
        path: SOFIA_APP/dist/manual-evidence/
        if-no-files-found: error
        retention-days: 30
  release:
    # Keep the existing publication lock; never cancel a release mid-upload.
    concurrency:
      group: sofia-android-release
      cancel-in-progress: false
    name: Publish only after owner approves the candidate APK
    needs: [build, native_tests]
    # No public release on normal pushes or pre-approval manual APKs.
    # Owner approval is a separate [approved-apk] commit after testing.
    if: needs.build.outputs.release == 'true' && contains(github.event.head_commit.message, '[approved-apk]') && !contains(github.event.head_commit.message, '[manual-apk]')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      SOFIA_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
      SOFIA_RELEASE_VERSION: ${{ needs.build.outputs.version }}
      SOFIA_RELEASE_CODE: ${{ needs.build.outputs.version_code }}
      SOFIA_BASELINE_VERSION: ${{ needs.build.outputs.baseline_version }}
      SOFIA_BASELINE_TAG: ${{ needs.build.outputs.baseline_tag }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ needs.build.outputs.source_sha }}
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: |-
          SOFIA_APP/package-lock.json
          package-lock.json
    - name: Restore exact compiled APKs; do not recompile in test jobs
      uses: actions/download-artifact@v4
      with:
        name: ${{ needs.build.outputs.artifact_name }}
        path: SOFIA_APP/dist
    - name: Restore all attempts of the two native shards
      uses: actions/download-artifact@v4
      with:
        pattern: Sofia-native-${{ github.run_id }}-*
        path: SOFIA_APP/dist/native-evidence
        merge-multiple: false
    - name: Require both shards to pass on this exact APK and source
      id: all_native_gates
      working-directory: SOFIA_APP
      run: python3 tools/native-shards.py verify-results
    - name: Install locked tools for the verified publication
      working-directory: SOFIA_APP
      run: npm ci
    - name: Require live server support before publishing the APK
      run: |
        curl -fsS --max-time 30 --retry 3 --retry-delay 2 --retry-max-time 60 https://sofiaos.up.railway.app/health > SOFIA_APP/dist/server-release-gate.json
        node -e "const h=require('./SOFIA_APP/dist/server-release-gate.json');if(!h.ok||!h.task_description_format||!h.selected_task_context||!h.agenda_priority||!h.persistent_sessions)throw Error('Server publication is required before the APK release; all existing records remain preserved')"
      id: server_gate
    - name: Publish exact checked APK on existing update channel
      working-directory: SOFIA_APP
      run: node tools/publish-release.cjs
      id: publish
    - name: Verify published APK discovery with both installed and new updater
      working-directory: SOFIA_APP
      run: |
        set -euo pipefail
        git show fbec831626845bf18b6b648e3ee257321b16bc7f:SOFIA_APP/src/lib/update.ts > /tmp/sofia-032-updater.ts
        node <<'NODE' | tee dist/update-discovery.txt
        const fs=require('fs'),ts=require('typescript'),vm=require('vm');
        (async()=>{for(const file of ['/tmp/sofia-032-updater.ts','src/lib/update.ts']){
          const exports={};const code=ts.transpileModule(fs.readFileSync(file,'utf8'),{compilerOptions:{target:ts.ScriptTarget.ES2022,module:ts.ModuleKind.CommonJS}}).outputText;
          vm.runInNewContext(code,{exports,fetch,AbortController,setTimeout,clearTimeout,Date,Error,Promise});
          const result=await exports.checkForUpdate({currentVersion:process.env.SOFIA_BASELINE_VERSION});
          if(result?.version!==process.env.SOFIA_RELEASE_VERSION)throw Error('Update not discoverable: '+file);
          console.log('VERIFIED',file,result.version,result.url);
        }})().catch(e=>{console.error(e);process.exitCode=1});
        NODE
        gh api "repos/avsord/sofiaos/releases/tags/sofia-android-v${SOFIA_RELEASE_VERSION}" > dist/release.json
      id: discovery
    - name: Report delivery outcome
      id: delivery_status
      if: always()
      continue-on-error: true
      env:
        DELIVERY_STATUS: ${{ job.status }}
        DELIVERY_PLANNED: ${{ needs.build.outputs.release }}
        DELIVERY_PUBLISHED: ${{ steps.publish.outcome }}
        DELIVERY_VERSION: ${{ needs.build.outputs.version }}
        DELIVERY_REASON: ${{ needs.build.outputs.reason }}
        DELIVERY_STEPS: ${{ toJSON(steps) }}
      run: node SOFIA_APP/tools/delivery.cjs report
    - name: Retain final publication and discovery evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Sofia-Android-${{ needs.build.outputs.version }}-${{ github.run_attempt }}
        path: SOFIA_APP/dist/
        if-no-files-found: warn
        retention-days: 30
        compression-level: 0
