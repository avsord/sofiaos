name: Sofia credential durability review
on:
  push:
    branches: [fix/private-filter-durability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Credentials survive a new deploy directory
        run: node --test tests/credential-durability.test.cjs
      - name: Backend regression suite
        run: node --test tests/*.test.cjs
      - name: Syntax checks
        run: |
          node --check src/services/credential-storage.js
          node --check src/services/credentials.js
