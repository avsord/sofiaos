name: Recheck existing manual APK on supported graphics
'on':
  push:
    branches: [sofia-app-android]
    paths: [.github/workflows/sofia-manual-recheck.yml, tools/recheck-manual-apk.py]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native_recheck:
    name: Validate exact 102 APK without rebuilding or publishing
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/download-artifact@v4
      with:
        name: Sofia-build-38008561596-1
        run-id: 38008561596
        github-token: ${{ github.token }}
        path: manual-check/SOFIA_APP/dist
    - uses: actions/download-artifact@v4
      with:
        name: Sofia-build-37809157208-1
        run-id: 37809157208
        github-token: ${{ github.token }}
        path: manual-check/SOFIA_APP/dist/seed-060
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Recheck unchanged acceptance with supported ANGLE graphics
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        arch: x86_64
        target: default
        disable-animations: false
        emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
        script: python3 tools/recheck-manual-apk.py
    - name: Keep actual acceptance and transition video
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Sofia-manual-recheck-${{ github.run_id }}-${{ github.run_attempt }}
        path: manual-check/SOFIA_APP/dist/manual-evidence/
        if-no-files-found: error
        retention-days: 30
